# Builds MYeats and publishes it to GitHub Pages at https://<user>.github.io/<repo>/.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # SPEC §10: typecheck, lint, unit and e2e tests must pass before a deploy.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run e2e
        env:
          CI: 'true'
      - run: npm run build
        env:
          # Served from /<repo>/, not the domain root.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Optional cloud sync. One-time setup: after `npx dexie-cloud create`, add the database
          # URL (https://xxxx.dexie.cloud) as a repository VARIABLE named DEXIE_CLOUD_URL
          # (repo Settings -> Secrets and variables -> Actions -> Variables). It is public, not a
          # secret. Unset = the deployed app is local-only.
          VITE_DEXIE_CLOUD_URL: ${{ vars.DEXIE_CLOUD_URL }}
          # Free USDA FoodData Central key (rate-limit only, ships in the bundle). Repository VARIABLE.
          VITE_USDA_API_KEY: ${{ vars.USDA_API_KEY }}
      # Main-bundle budget (SPEC §9).
      - run: npm run size
      # GitHub Pages has no SPA rewrites: serve the app for unknown paths (deep links, refreshes).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
